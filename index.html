<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14171a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Session">
  <title>Session — Pomodoro</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root{color-scheme:dark;--bg:#14171a;--panel:#1b2024;--text:#f7f3ed;--muted:#aaa69f;--line:#30363c;--warm:#e5532d;--cream:#f5f0e8;--ring:min(78vw,430px);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.035),transparent 34%),var(--bg);overflow-x:hidden;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--cream);outline-offset:3px}.hidden{display:none!important}
    .app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}.top{width:min(100%,720px);margin:auto;display:grid;gap:14px}.brand-row{display:flex;justify-content:space-between;align-items:center;min-height:36px}.brand{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.hint{font-size:11px;color:#7f858b}.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;min-width:66px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.018);padding:9px 14px;color:#a8adb2;font-weight:750;cursor:pointer}.tab.active{color:#15181b;background:var(--cream);border-color:var(--cream)}.tab.add{min-width:43px;padding-inline:0;font-size:20px}
    main{min-height:0;display:grid;place-items:center;padding:18px 0 24px}.view{width:100%}.timer{position:relative;width:var(--ring);aspect-ratio:1;margin:auto;display:grid;place-items:center;border-radius:50%;isolation:isolate}.timer:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.026),rgba(255,255,255,.006));box-shadow:inset 0 0 0 1px rgba(255,255,255,.035),0 28px 70px rgba(0,0,0,.17);z-index:-1}.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible;pointer-events:none}.track,.progress{fill:none;stroke-width:6;vector-effect:non-scaling-stroke}.track{stroke:#252a2f}.progress{stroke:var(--warm);stroke-linecap:round;transition:stroke-dashoffset .2s linear,stroke .35s}.mode-break .progress{stroke:var(--cream)}
    .content{width:75%;display:grid;justify-items:center;align-content:center;gap:16px;text-align:center}.eyebrow{margin:0;color:var(--muted);font-size:clamp(12px,2.6vw,15px);font-weight:800;letter-spacing:.16em}.state-focus{color:#f08a69}.state-break{color:var(--cream)}.preset,.clock{margin:0;font-variant-numeric:tabular-nums;letter-spacing:-.05em;line-height:.95}.preset{font-size:clamp(48px,13vw,78px);font-weight:720;color:#f1ede7}.clock{font-size:clamp(58px,15.5vw,96px);font-weight:760;color:#fffaf4}.detail,.subline{margin:0;color:var(--muted);font-size:clamp(12px,2.9vw,15px);font-weight:680}.set-block{width:min(100%,285px);display:grid;gap:8px}.set-caption{font-size:11px;font-weight:800;letter-spacing:.13em;color:#737980}.set-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.set-btn{border:1px solid var(--line);border-radius:10px;background:transparent;color:#8e949a;height:31px;padding:0;font-size:12px;font-weight:750;cursor:pointer}.set-btn.selected{background:rgba(229,83,45,.16);color:#ff9b7b;border-color:rgba(229,83,45,.52)}
    .primary{border:0;border-radius:999px;background:var(--cream);color:#171a1d;min-width:132px;min-height:48px;padding:0 26px;font-weight:850;letter-spacing:.04em;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.23)}.controls{width:min(100%,430px);margin:16px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.control{border:1px solid #343a40;border-radius:16px;background:var(--panel);min-height:50px;padding:0 16px;color:#e8e4de;font-weight:790;cursor:pointer}.control.stop{color:#ff9c87}.footer{width:min(100%,720px);margin:auto;color:#61676d;text-align:center;font-size:11px;min-height:14px}
    .backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(5,7,9,.73);backdrop-filter:blur(12px)}.modal{position:relative;width:min(100%,410px);border:1px solid #373e45;border-radius:24px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.42);padding:25px}.modal h2{margin:0 44px 22px 0;font-size:21px}.close{position:absolute;top:16px;right:16px;width:36px;height:36px;border:1px solid #3a4148;border-radius:50%;background:#20262b;color:#b6bbc0;font-size:22px;cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:8px}.field label{color:#9da3a9;font-size:12px;font-weight:760}.field input{width:100%;border:1px solid #3a4148;border-radius:14px;background:#14181b;color:var(--text);padding:13px 14px;font-size:18px;font-weight:760}.error{min-height:18px;margin:12px 0 0;color:#ff8069;font-size:12px;font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.modal-btn{border:1px solid #3a4148;border-radius:13px;min-height:43px;padding:0 18px;background:#20262b;color:#e4e0da;font-weight:800;cursor:pointer}.modal-btn.save{border-color:var(--cream);background:var(--cream);color:#15181b}.modal-btn.delete{margin-right:auto;color:#ff9b86}
    @media(max-width:520px){:root{--ring:min(88vw,410px)}.app{padding-inline:12px}.hint{display:none}.content{width:78%;gap:14px}.set-block{width:min(100%,260px)}.set-picker{gap:4px}.set-btn{height:29px;border-radius:9px}}
    @media(max-height:720px){:root{--ring:min(70vh,390px)}.app{grid-template-rows:auto 1fr}.footer,.brand-row{display:none}.top{gap:6px}main{padding-block:8px 12px}.content{gap:11px}.set-caption{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand-row"><div class="brand">Session</div><div class="hint">長押しでプリセット編集</div></div>
      <nav class="tabs" id="tabbar" aria-label="タイマープリセット"></nav>
    </header>
    <main>
      <section class="view" id="setupView" aria-label="セッション設定">
        <div class="timer">
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="92"></circle></svg>
          <div class="content">
            <p class="eyebrow">プリセット</p>
            <h1 class="preset" id="presetLabel">45–5</h1>
            <p class="detail" id="presetDetail">集中 45分 ・ 休憩 5分</p>
            <div class="set-block"><span class="set-caption">セット数</span><div class="set-picker" id="setPicker"></div></div>
            <button class="primary" id="startBtn" type="button">スタート</button>
          </div>
        </div>
      </section>
      <section class="view hidden" id="runView" aria-live="polite">
        <div class="timer">
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="92"></circle><circle class="progress" id="ringFg" cx="100" cy="100" r="92"></circle></svg>
          <div class="content"><p class="eyebrow state-focus" id="runEyebrow">集中</p><p class="clock" id="clockDisplay">45:00</p><p class="subline" id="runSubline">セット 1 / 3</p></div>
        </div>
        <div class="controls hidden" id="runControls"><button class="control" id="pauseBtn" type="button">一時停止</button><button class="control stop" id="stopBtn" type="button">終了</button></div>
      </section>
    </main>
    <footer class="footer" id="footerNote">集中と休憩を、迷わず切り替える。</footer>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
